name: Update SDK Documentation

on:
  workflow_dispatch: # Manual trigger only

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-sdk-docs:
    runs-on: ubuntu-latest

    permissions:
      contents: write       # Required for pushing changes
      pull-requests: write  # Required for creating PRs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # The scraper drives the Docma SPA with puppeteer, so it needs a browser.
      # Cache the download separately from node_modules; npm ci skips it on a hit.
      - name: Cache puppeteer browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            puppeteer-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Ensure Chrome is available
        run: npx puppeteer browsers install chrome

      - name: Update SDK documentation
        run: npm run update-sdk-docs

      - name: Validate SDK documentation
        run: npm run validate-sdk-docs

      - name: Check for changes
        id: git-check
        run: |
          # Stage all changes (including new/deleted files) to detect them with git diff
          git add public/sdk-docs/
          git add src/tools/sdk-docs/schema/list-sdk-docs.input.schema.ts

          # Detect changes only in meaningful files.
          # metadata.json is excluded: generatedAt changes on every run.
          git diff --cached --exit-code -- \
            public/sdk-docs/map/ \
            public/sdk-docs/overlay/ \
            public/sdk-docs/control/ \
            public/sdk-docs/coordinates/ \
            public/sdk-docs/options/ \
            public/sdk-docs/style/ \
            public/sdk-docs/index/ \
            src/tools/sdk-docs/schema/list-sdk-docs.input.schema.ts \
            || echo "changed=true" >> $GITHUB_OUTPUT

          # Only generate summary when there are changes
          if git diff --cached --quiet -- \
            public/sdk-docs/map/ \
            public/sdk-docs/overlay/ \
            public/sdk-docs/control/ \
            public/sdk-docs/coordinates/ \
            public/sdk-docs/options/ \
            public/sdk-docs/style/ \
            public/sdk-docs/index/ \
            src/tools/sdk-docs/schema/list-sdk-docs.input.schema.ts; then exit 0; fi

          # File change list (meaningful changes only, excluding metadata.json)
          CHANGE_LIST=$(git diff --cached --name-status -- \
            public/sdk-docs/map/ public/sdk-docs/overlay/ public/sdk-docs/control/ \
            public/sdk-docs/coordinates/ public/sdk-docs/options/ public/sdk-docs/style/ \
            public/sdk-docs/index/ src/tools/sdk-docs/schema/ 2>/dev/null | awk '
            $1=="A" { print "- **Added**: " $2 }
            $1=="M" { print "- **Modified**: " $2 }
            $1=="D" { print "- **Removed**: " $2 }
          ')

          # Diff stats
          DIFF_STAT=$(git diff --cached --stat -- public/sdk-docs/ src/tools/sdk-docs/schema/)

          # Symbol count reported by the pipeline
          TOTAL_DOCS=$(node -p "require('./public/sdk-docs/metadata.json').totalDocs")

          # File count (for PR title)
          ADDED=$(git diff --cached --name-status -- public/sdk-docs/ | grep -c "^A" || true)
          MODIFIED=$(git diff --cached --name-status -- public/sdk-docs/ | grep -c "^M" || true)
          DELETED=$(git diff --cached --name-status -- public/sdk-docs/ | grep -c "^D" || true)

          # Save multi-line output to GITHUB_OUTPUT
          {
            echo "change_list<<EOF_CHANGES"
            echo "$CHANGE_LIST"
            echo "EOF_CHANGES"
            echo "diff_stat<<EOF_STAT"
            echo "$DIFF_STAT"
            echo "EOF_STAT"
            echo "added=$ADDED"
            echo "modified=$MODIFIED"
            echo "deleted=$DELETED"
            echo "total_docs=$TOTAL_DOCS"
          } >> $GITHUB_OUTPUT

      - name: Create branch and push changes
        if: steps.git-check.outputs.changed == 'true'
        id: create-pr
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create branch name with timestamp
          BRANCH_NAME="docs/sdk-update-$(date +%Y%m%d-%H%M%S)"
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT

          # Create and switch to new branch
          git checkout -b "$BRANCH_NAME"

          # Build PR title with change counts
          ADDED="${{ steps.git-check.outputs.added }}"
          MODIFIED="${{ steps.git-check.outputs.modified }}"
          DELETED="${{ steps.git-check.outputs.deleted }}"

          TITLE_PARTS=""
          [ "$ADDED" -gt 0 ] 2>/dev/null && TITLE_PARTS="${TITLE_PARTS}${TITLE_PARTS:+, }${ADDED} added"
          [ "$MODIFIED" -gt 0 ] 2>/dev/null && TITLE_PARTS="${TITLE_PARTS}${TITLE_PARTS:+, }${MODIFIED} modified"
          [ "$DELETED" -gt 0 ] 2>/dev/null && TITLE_PARTS="${TITLE_PARTS}${TITLE_PARTS:+, }${DELETED} removed"

          if [ -n "$TITLE_PARTS" ]; then
            PR_TITLE="docs: Update SDK documentation ($TITLE_PARTS)"
          else
            PR_TITLE="docs: Update SDK documentation"
          fi

          # Commit changes (already staged in "Check for changes" step)
          git commit -m "$PR_TITLE

          Auto-generated by GitHub Actions
          Workflow: ${{ github.workflow }}
          Run: ${{ github.run_number }}"

          # Push to new branch
          git push origin "$BRANCH_NAME"

          # Build PR body
          CHANGE_LIST="${{ steps.git-check.outputs.change_list }}"
          DIFF_STAT="${{ steps.git-check.outputs.diff_stat }}"
          TOTAL_DOCS="${{ steps.git-check.outputs.total_docs }}"

          # Create pull request
          gh pr create \
            --title "$PR_TITLE" \
            --body "## SDK Documentation Update

          This PR was automatically generated by the \`Update SDK Documentation\` workflow.
          The scraper reads the parsed JSDoc data the Docma SPA exposes at \`window.docma.apis\`
          and rewrites \`public/sdk-docs/\` plus the auto-generated \`list_sdk_docs\` input schema.

          ### Changes
          ${CHANGE_LIST:-_No meaningful file changes detected (only metadata updated)._}

          ### Stats
          \`\`\`
          $DIFF_STAT
          \`\`\`

          **Symbols:** $TOTAL_DOCS
          **Validation:** \`npm run validate-sdk-docs\` passed.

          ### Review notes
          - Check the workflow log for \`unmatched typedef\` warnings — a new type fell back to a
            default category and may need a naming rule in \`assignCategory\`.
          - Check for \`event target spec\` / \`property note\` warnings — those mean a hardcoded
            supplement in \`scripts/update-sdk-docs.js\` no longer matches a symbol, so it was
            silently dropped. See the exceptions section in \`CLAUDE.md\`.

          ---
          Auto-generated by [GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
            --base main \
            --head "$BRANCH_NAME"

      - name: No changes detected
        if: steps.git-check.outputs.changed != 'true'
        run: echo "No changes detected in SDK documentation"
