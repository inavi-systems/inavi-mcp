<!DOCTYPE html>
<html>
    <head>
    <meta charset="UTF-8">
    <title>지도 생성하기</title>
    <style>
        #map {
        width: 100%;
        height: 500px;
        }
    </style>
    </head>
    <body>
    <div id="map"></div>
    <script>
        function initMap() {
        const map = new inavi.maps.Map({
            center: [127.110749, 37.402158],
            container: "map",
            zoom: 13
        });
        }
    </script>
    <script type="text/javascript" src="{base_url}/appkeys/{appKey}/maps?callback=initMap"></script>
    </body>
</html>
